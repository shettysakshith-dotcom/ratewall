[project]
name = "ratewall"
version = "0.1.0"
description = "A pluggable token-bucket rate limiter with Starlette/ASGI middleware."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
]

[project.scripts]
ratewall = "ratewall:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
